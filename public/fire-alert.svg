<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Badge -->
  <polygon points="64,8 116,28 116,74 64,120 12,74 12,28" fill="url(#shieldGrad)" stroke="#ef4444" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner Border Glow -->
  <polygon points="64,16 108,32 108,70 64,110 20,70 20,32" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Wildfire Flame -->
  <path d="M64 26 C66 38, 80 44, 82 58 C84 72, 74 80, 74 88 C74 94, 78 98, 82 100 C74 106, 52 104, 46 90 C42 80, 48 70, 52 64 C56 58, 56 48, 52 40 C58 38, 62 32, 64 26 Z" fill="url(#flameGrad)" />
  <path d="M64 50 C66 60, 74 66, 72 76 C70 86, 60 92, 58 98 C54 94, 52 86, 56 78 C60 70, 62 62, 64 50 Z" fill="url(#innerFlame)" />

  <!-- Algerian Star & Crescent Accent Symbol in Bottom Right -->
  <circle cx="94" cy="94" r="14" fill="#047857" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M96 85 A8 8 0 1 0 96 103 A6.5 6.5 0 1 1 96 85 Z" fill="#ffffff"/>
  <polygon points="98,91 99.5,94 103,94 100,96 101.5,99 98,97 94.5,99 96,96 93,94 96.5,94" fill="#ef4444"/>
</svg>
